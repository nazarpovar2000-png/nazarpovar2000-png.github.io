<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closet Design Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
/* Layout: one column; closet tabs, then variant pills, then a large photo with thumbnails, then the variant notes and an on-demand 3D viewer. */
:root{
  --bg:#f4f4f2; --surface:#ffffff; --ink:#1f2328; --muted:#5d636b; --line:#dcdcd7; --accent:#2f5d62; --accent-ink:#ffffff;
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --body:"Source Sans 3", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#15181b; --surface:#1d2125; --ink:#eceff1; --muted:#a3abb3; --line:#30363c; --accent:#6fa7ad; --accent-ink:#0f1416; color-scheme: dark; }
}
:root[data-theme="dark"]{ --bg:#15181b; --surface:#1d2125; --ink:#eceff1; --muted:#a3abb3; --line:#30363c; --accent:#6fa7ad; --accent-ink:#0f1416; color-scheme: dark; }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.5}
.wrap{max-width:1120px; margin:0 auto; padding:24px 20px 48px; display:flex; flex-direction:column; gap:20px}
header{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap}
.brand{font-family:var(--display); font-weight:700; letter-spacing:.06em; text-transform:uppercase; font-size:13px; color:var(--muted)}
h1{font-family:var(--display); font-weight:700; font-size:clamp(26px,4vw,38px); line-height:1.1; margin:4px 0 0; text-wrap:balance}
.sub{color:var(--muted); margin:6px 0 0; max-width:65ch}
.lang{display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden}
.lang button{border:0; background:transparent; color:var(--ink); padding:6px 12px; font:600 14px var(--body); cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}

.tabs{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.tab{border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:10px; padding:12px 14px; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:2px}
.tab b{font-family:var(--display); font-size:18px}
.tab span{color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}

.variants{display:flex; gap:8px; flex-wrap:wrap}
.vbtn{border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px; padding:8px 16px; font:600 15px var(--body); cursor:pointer}
.vbtn[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}

.viewer{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:20px; align-items:start}
@media (max-width:860px){ .viewer{grid-template-columns:1fr} }
.stage{display:flex; flex-direction:column; gap:10px}
.main{position:relative; border-radius:12px; overflow:hidden; background:var(--surface); border:1px solid var(--line); cursor:zoom-in}
.main img{display:block; width:100%; height:auto; aspect-ratio:4/3; object-fit:cover}
.cap{font-size:14px; color:var(--muted)}
.thumbs{display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px}
.thumbs button{padding:0; border:2px solid var(--line); border-radius:8px; overflow:hidden; background:none; cursor:pointer}
.thumbs button[aria-current="true"]{border-color:var(--accent)}
.thumbs img{display:block; width:100%; aspect-ratio:4/3; object-fit:cover}

.notes{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; display:flex; flex-direction:column; gap:10px}
.notes h2{font-family:var(--display); font-size:20px; margin:0; text-wrap:balance}
.notes p{margin:0; color:var(--muted)}
.notes ul{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:4px}

.three{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; display:flex; flex-direction:column; gap:12px}
.three h2{font-family:var(--display); font-size:20px; margin:0}
.three p{margin:0; color:var(--muted); max-width:65ch}
.load3d{align-self:flex-start; border:0; background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:8px; font:600 15px var(--body); cursor:pointer}
model-viewer{width:100%; height:min(70vh,560px); background:var(--bg); border-radius:10px; --poster-color:transparent}
.foot{font-size:14px; color:var(--muted); max-width:75ch}

.lb{position:fixed; inset:0; background:rgba(10,12,14,.92); display:none; align-items:center; justify-content:center; padding:16px; z-index:10}
.lb[data-open="true"]{display:flex}
.lb img{max-width:100%; max-height:100%; border-radius:8px}
.lb button{position:absolute; top:12px; right:12px; border:0; background:#fff; color:#111; border-radius:999px; padding:8px 14px; font:600 15px var(--body); cursor:pointer}

/* ---- Floor section ---- */
.tabs{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){ .tabs{grid-template-columns:1fr} }
#floorSec{display:none; flex-direction:column; gap:20px}
.fgrid{display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:20px; align-items:start}
@media (max-width:900px){ .fgrid{grid-template-columns:1fr} }
.fvis{display:flex; flex-direction:column; gap:10px}
.fcanvas{width:100%; height:auto; border-radius:12px; background:var(--surface); border:1px solid var(--line); display:block}
.swrow{display:flex; gap:12px; align-items:center}
.swatch{width:96px; height:96px; border-radius:10px; border:1px solid var(--line); flex:none}
.swtext{font-size:14px; color:var(--muted)}
.swtext b{display:block; color:var(--ink); font-size:16px}
.fpanel{display:flex; flex-direction:column; gap:14px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:8px}
.card h3{font-family:var(--display); font-size:16px; margin:0}
.opt{display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer; background:var(--surface); text-align:left; color:var(--ink); font:inherit; width:100%}
.opt[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.opt .dot{width:16px; height:16px; border-radius:50%; border:2px solid var(--line); flex:none; margin-top:3px}
.opt[aria-pressed="true"] .dot{border-color:var(--accent); background:var(--accent)}
.opt .ot{flex:1; display:flex; flex-direction:column; gap:2px}
.opt .ot b{font-size:15px}
.opt .ot span{font-size:13px; color:var(--muted)}
.opt .op{font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:999px; padding:5px 12px 5px 5px; background:var(--surface); color:var(--ink); font:600 14px var(--body); cursor:pointer}
.chip i{width:24px; height:24px; border-radius:50%; display:block; background-size:cover; border:1px solid rgba(0,0,0,.15)}
.chip[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.chip:disabled{opacity:.4; cursor:not-allowed}
.hint{font-size:13px; color:var(--muted); margin:0}
.total{display:flex; flex-direction:column; gap:6px}
.trow{display:flex; justify-content:space-between; gap:12px; font-size:15px; font-variant-numeric:tabular-nums}
.trow.sum{font-family:var(--display); font-size:24px; border-top:1px solid var(--line); padding-top:8px}
.scope ol{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:8px}
.scope li b{display:block}
.scope li span{color:var(--muted); font-size:14px}
.notice{font-size:14px; color:var(--muted); border-left:3px solid var(--accent); padding-left:10px; margin:0}

button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion: no-preference){ .main img{transition:opacity .2s} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">NEZER Repair &amp; Remodeling</div>
      <h1 id="t-title">Closet design concepts</h1>
      <p class="sub" id="t-sub"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button id="l-en" type="button" aria-pressed="true">EN</button>
      <button id="l-ru" type="button" aria-pressed="false">RU</button>
    </div>
  </header>

  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="variants" id="variants" role="group" aria-label="Variant"></div>

  <div class="viewer">
    <div class="stage">
      <div class="main" id="main" role="button" tabindex="0" aria-label="Open full size"><img id="mainImg" alt=""></div>
      <div class="cap" id="cap"></div>
      <div class="thumbs" id="thumbs"></div>
    </div>
    <aside class="notes">
      <h2 id="vTitle"></h2>
      <p id="vDesc"></p>
      <ul id="vList"></ul>
    </aside>
  </div>


  <section id="floorSec">
    <div class="fgrid">
      <div class="fvis">
        <canvas class="fcanvas" id="fcanvas" width="1457" height="1737" aria-label="Floor preview, top view"></canvas>
        <div class="swrow">
          <canvas class="swatch" id="swatch" width="192" height="192" aria-hidden="true"></canvas>
          <div class="swtext"><b id="swName"></b><span id="swNote"></span></div>
        </div>
        <p class="hint" id="fvHint"></p>
      </div>
      <div class="fpanel">
        <div class="card"><h3 id="f-optT"></h3><div id="fopts" style="display:flex;flex-direction:column;gap:8px"></div></div>
        <div class="card" id="spCard"><h3 id="f-spT"></h3><div class="chips" id="fspecies"></div><p class="hint" id="spHint"></p></div>
        <div class="card" id="stCard"><h3 id="f-stT"></h3><div class="chips" id="fstains"></div><p class="hint" id="stHint"></p></div>
        <div class="card total" id="ftotal"></div>
      </div>
    </div>
    <div class="card scope"><h3 id="scopeT"></h3><ol id="scopeList"></ol><p class="notice" id="scopeNote"></p></div>
  </section>

  <section class="three">
    <h2 id="t-3d">3D model</h2>
    <p id="t-3dtext"></p>
    <button class="load3d" id="load3d" type="button"></button>
    <div id="mvHost"></div>
  </section>

  <p class="foot" id="t-foot"></p>
</div>

<div class="lb" id="lb" data-open="false"><img id="lbImg" alt=""><button type="button" id="lbClose">Close</button></div>

const FT = {

  ru:{tab:["Пол","Коридор + спальня · 310 кв. футов"], optT:"Вариант эстимейта", spT:"Порода дерева", stT:"Цвет покрытия", scopeT:"Объём работ",

let fOpt = "1", fSp = "fir", fSt = "natural";
const fImgs = {};
function fLoad(src){ return fImgs[src] || (fImgs[src] = new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; })); }
const money = n => "$" + Math.round(n).toLocaleString("en-US");
function fState(){
  const o = FL.options.find(x => x.id === fOpt);
  const sp = o.speciesLock === "fir" ? "fir" : (o.speciesLock === "existing" ? "fir" : fSp);
  const st = o.stain ? fSt : "natural";
  const spObj = FL.species.find(x => x.id === sp), stObj = FL.stains.find(x => x.id === st);
  const spAdd = o.speciesLock ? 0 : spObj.add * o.newSqft * (1 + FL.waste);
  const stAdd = o.stain ? stObj.add * o.finishSqft : 0;
  return {o, sp, st, spObj, stObj, spAdd, stAdd, total: o.base + spAdd + stAdd};
}
async function fDraw(){
  const S = fState(), cv = $("fcanvas"), ctx = cv.getContext("2d");
  const [plan, mask, shade, wood] = await Promise.all([fLoad("floor/plan.jpg"), fLoad("floor/mask.png"), fLoad("floor/shade.png"), fLoad("floor/wood_" + S.spObj.img + ".jpg")]);
  if (!plan) return;
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  ctx.drawImage(plan, 0, 0, cv.width, cv.height);
  const changed = S.o.id !== "3" && !(S.sp === "fir" && S.st === "natural" && S.o.id === "1" && false);
  if (S.o.id !== "3" && wood && mask && shade){
    const off = document.createElement("canvas"); off.width = cv.width; off.height = cv.height;
    const o = off.getContext("2d");
    const tile = document.createElement("canvas"); const ts = 230; tile.width = ts; tile.height = ts;
    tile.getContext("2d").drawImage(wood, 0, 0, ts, ts);
    o.fillStyle = o.createPattern(tile, "repeat"); o.fillRect(0, 0, off.width, off.height);
    if (S.stObj.color){ o.globalCompositeOperation = "multiply"; o.globalAlpha = 0.88; o.fillStyle = S.stObj.color; o.fillRect(0, 0, off.width, off.height); o.globalAlpha = 1; }
    o.globalCompositeOperation = "multiply"; o.drawImage(shade, 0, 0, off.width, off.height);
    o.globalCompositeOperation = "destination-in"; o.drawImage(mask, 0, 0, off.width, off.height);
    ctx.drawImage(off, 0, 0);
  }
  // swatch
  const sw = $("swatch"), sx = sw.getContext("2d");
  sx.globalCompositeOperation = "source-over"; sx.globalAlpha = 1;
  if (S.o.id === "3"){ sx.drawImage(plan, 760, 1150, 160, 160, 0, 0, sw.width, sw.height); }
  else if (wood){
    sx.drawImage(wood, 0, 0, 384, 384, 0, 0, sw.width, sw.height);
    if (S.stObj.color){ sx.globalCompositeOperation = "multiply"; sx.globalAlpha = 0.88; sx.fillStyle = S.stObj.color; sx.fillRect(0, 0, sw.width, sw.height); }
  }
}
function fRender(){
  const t = FT[lang], S = fState();
  $("f-optT").textContent = t.optT; $("f-spT").textContent = t.spT; $("f-stT").textContent = t.stT; $("scopeT").textContent = t.scopeT;
  $("fvHint").textContent = t.vis;
  const oh = $("fopts"); oh.innerHTML = "";
  FL.options.forEach(o => {
    const b = document.createElement("button"); b.type = "button"; b.className = "opt"; b.id = "fo-" + o.id;
    b.setAttribute("aria-pressed", o.id === fOpt);
    b.innerHTML = '<span class="dot"></span><span class="ot"><b></b><span></span></span><span class="op"></span>';
    b.querySelector("b").textContent = o[lang].name; b.querySelector(".ot span").textContent = o[lang].sub;
    b.querySelector(".op").textContent = money(o.base);
    b.onclick = () => { fOpt = o.id; fRender(); };
    oh.appendChild(b);
  });
  const sh = $("fspecies"); sh.innerHTML = "";
  FL.species.forEach(sp => {
    const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.id = "fs-" + sp.id;
    b.innerHTML = '<i></i><span></span>'; b.querySelector("i").style.backgroundImage = "url(floor/wood_" + sp.img + ".jpg)";
    b.querySelector("span").textContent = sp[lang] + (sp.add && !S.o.speciesLock ? " +$" + sp.add.toFixed(2) + "/" + t.sqft : "");
    b.setAttribute("aria-pressed", sp.id === S.sp);
    b.disabled = !!S.o.speciesLock && sp.id !== "fir";
    b.onclick = () => { fSp = sp.id; fRender(); };
    sh.appendChild(b);
  });
  $("spHint").textContent = S.o.speciesLock === "fir" ? t.spLock1 : (S.o.speciesLock === "existing" ? t.spLock3 : "");
  const st = $("fstains"); st.innerHTML = "";
  FL.stains.forEach(x => {
    const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.id = "ft-" + x.id;
    b.innerHTML = '<i></i><span></span>';
    b.querySelector("i").style.background = x.color ? x.color : "linear-gradient(135deg,#e9d3ae,#d8b27c)";
    b.querySelector("span").textContent = x[lang] + (x.add && S.o.stain ? " +$" + x.add.toFixed(2) + "/" + t.sqft : "");
    b.setAttribute("aria-pressed", x.id === S.st);
    b.disabled = !S.o.stain;
    b.onclick = () => { fSt = x.id; fRender(); };
    st.appendChild(b);
  });
  const dark = ["provincial","swalnut","jacobean","ebony","early"].includes(S.st);
  $("stHint").textContent = !S.o.stain ? t.stNo : ((S.sp === "fir" || S.sp === "maple") && dark ? t.blotch : "");
  const tot = $("ftotal");
  const rows = [[t.base, S.o.base]];
  if (S.spAdd) rows.push([t.spAdd + " (" + S.spObj[lang] + ", " + Math.round(S.o.newSqft * (1 + FL.waste)) + " " + t.sqft + ")", S.spAdd]);
  if (S.stAdd) rows.push([t.stAdd + " (" + S.stObj[lang] + ", " + S.o.finishSqft + " " + t.sqft + ")", S.stAdd]);
  tot.innerHTML = "";
  rows.forEach(r => { const d = document.createElement("div"); d.className = "trow"; d.innerHTML = "<span></span><span></span>"; d.children[0].textContent = r[0]; d.children[1].textContent = money(r[1]); tot.appendChild(d); });
  const d = document.createElement("div"); d.className = "trow sum"; d.innerHTML = "<span></span><span></span>"; d.children[0].textContent = t.total; d.children[1].textContent = money(S.total); tot.appendChild(d);
  $("swName").textContent = S.o.id === "3" ? t.existing : (S.spObj[lang] + " · " + S.stObj[lang]);
  $("swNote").textContent = S.o.id === "3" ? "" : (S.o.speciesLock === "fir" ? "" : "");
  const ol = $("scopeList"); ol.innerHTML = "";
  S.o.scope[lang].forEach(([h, txt]) => { const li = document.createElement("li"); li.innerHTML = "<b></b><span></span>"; li.children[0].textContent = h; li.children[1].textContent = txt; ol.appendChild(li); });
  $("scopeNote").textContent = S.o.note[lang];
  fDraw();
}

let lang = "en", closet = "c1", variant = "a", idx = 0;
try { const s = localStorage.getItem("closetLang"); if (s === "ru" || s === "en") lang = s; } catch (e) {}

const $ = id => document.getElementById(id);

function readHash(){
  if (location.hash === "#floor"){ closet = "floor"; return; }
  const m = location.hash.match(/^#closet([12])-([a-e])$/);
  if (m){ closet = "c" + m[1]; variant = m[2]; idx = 0; }
}
function writeHash(){
  const h = closet === "floor" ? "#floor" : "#closet" + closet.slice(1) + "-" + variant;
  if (location.hash !== h) history.replaceState(null, "", h);
}

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  $("t-title").textContent = t.title; $("t-sub").textContent = t.sub;
  $("t-3d").textContent = t.t3d; $("t-3dtext").textContent = t.t3dtext; $("t-foot").textContent = t.foot;

    $("t-foot").textContent = lang === "ru" ? "Цены рассчитаны на 310 кв. футов. Окончательная цена подтверждается после осмотра на месте." : "Prices are based on 310 sq ft. Final price is confirmed after an on-site inspection.";
    fRender(); return;
  }
  const vs = $("variants"); vs.innerHTML = "";
  ["a","b","c","d","e"].forEach(v => {
    const b = document.createElement("button");
    b.className = "vbtn"; b.type = "button"; b.id = "v-" + v;
    b.textContent = D[closet][v][lang].name;
    b.setAttribute("aria-pressed", v === variant);
    b.onclick = () => { variant = v; idx = 0; writeHash(); render(); };
    vs.appendChild(b);
  });

  const V = D[closet][variant], L = V[lang];
  if (idx >= V.imgs.length) idx = 0;
  $("mainImg").src = "img/" + V.imgs[idx] + ".jpg";
  $("mainImg").alt = L.name + " — " + L.caps[idx];
  $("cap").textContent = L.caps[idx];

  const th = $("thumbs"); th.innerHTML = "";
  V.imgs.forEach((k, i) => {
    const b = document.createElement("button"); b.type = "button"; b.id = "th-" + i;
    b.setAttribute("aria-current", i === idx); b.setAttribute("aria-label", L.caps[i]);
    const im = document.createElement("img"); im.src = "img/" + k + ".jpg"; im.alt = "";
    b.appendChild(im); b.onclick = () => { idx = i; render(); };
    th.appendChild(b);
  });

  $("vTitle").textContent = L.name; $("vDesc").textContent = L.desc;
  const ul = $("vList"); ul.innerHTML = "";
  L.list.forEach(s => { const li = document.createElement("li"); li.textContent = s; ul.appendChild(li); });

  const mv = $("mvHost").querySelector("model-viewer");
  if (!$("load3d").disabled){
    $("load3d").textContent = mv ? t.reload : t.load;
    $("load3d").hidden = !!(mv && mv.dataset.key === closet + variant);
  }
}

$("load3d").onclick = () => {
  const host = $("mvHost");
  let mv = host.querySelector("model-viewer");
  if (!mv){
    mv = document.createElement("model-viewer");
    mv.setAttribute("camera-controls", "");
    mv.setAttribute("touch-action", "pan-y");
    mv.setAttribute("shadow-intensity", "0.6");
    mv.setAttribute("exposure", "1.05");
    mv.setAttribute("camera-orbit", "0deg 55deg auto");
    host.appendChild(mv);
  }
  const key = closet + variant;
  mv.setAttribute("alt", D[closet][variant][lang].name);
  $("load3d").disabled = true; $("load3d").textContent = lang === "ru" ? "Загрузка…" : "Loading…";
  loadModel(key).then(url => { mv.dataset.key = key; mv.setAttribute("src", url); $("load3d").disabled = false; render(); })
    .catch(() => { $("load3d").disabled = false; $("load3d").textContent = lang === "ru" ? "Не удалось загрузить 3D-модель. Попробуйте ещё раз" : "Could not load the 3D model. Try again"; });
};
const modelCache = {};
async function loadModel(key){ return "models/" + key + ".glb"; }

function openLb(){ $("lbImg").src = $("mainImg").src; $("lbImg").alt = $("mainImg").alt; $("lb").dataset.open = "true"; $("lbClose").focus(); }
function closeLb(){ $("lb").dataset.open = "false"; $("main").focus(); }
$("main").onclick = openLb;
$("main").onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); openLb(); } };
$("lbClose").onclick = closeLb;
$("lb").onclick = e => { if (e.target.id === "lb") closeLb(); };
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("lb").dataset.open === "true") closeLb(); });

function setLang(l){ lang = l; try { localStorage.setItem("closetLang", l); } catch (e) {} render(); }
$("l-en").onclick = () => setLang("en");
$("l-ru").onclick = () => setLang("ru");

window.addEventListener("hashchange", () => { readHash(); render(); });
