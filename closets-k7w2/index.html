<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link expired</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{ --bg:#f4f4f2; --surface:#ffffff; --ink:#1f2328; --muted:#5d636b; --line:#dcdcd7; color-scheme:light; }
@media (prefers-color-scheme: dark){ :root{ --bg:#15181b; --surface:#1d2125; --ink:#eceff1; --muted:#a3abb3; --line:#30363c; color-scheme:dark; } }
html,body{margin:0; height:100%}
body{background:var(--bg); color:var(--ink); font-family:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:32px 28px; max-width:460px; text-align:center; display:flex; flex-direction:column; gap:10px}
.brand{font-family:"Archivo",Arial,sans-serif; font-weight:700; letter-spacing:.06em; text-transform:uppercase; font-size:13px; color:var(--muted)}
h1{font-family:"Archivo",Arial,sans-serif; font-size:28px; margin:4px 0 0}
p{margin:0; color:var(--muted); font-size:17px; line-height:1.5}
</style>
</head>
<body>
  <main class="card">
    <div class="brand">NEZER Repair &amp; Remodeling</div>
    <h1>This link has expired</h1>
    <p>The closet design preview is no longer available. Please contact NEZER Repair &amp; Remodeling for a new link.</p>
  </main>
</body>
</html>
