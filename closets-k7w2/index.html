<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link expired</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{ --bg:#f4f4f2; --surface:#ffffff; --ink:#1f2328; --muted:#5d636b; --line:#dcdcd7; color-scheme:light; }
@media (prefers-color-scheme: dark){ :root{ --bg:#15181b; --surface:#1d2125; --ink:#eceff1; --muted:#a3abb3; --line:#30363c; color-scheme:dark; } }
html,body{margin:0; height:100%}
body{background:var(--bg); color:var(--ink); font-family:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:32px 28px; max-width:460px; text-align:center; display:flex; flex-direction:column; gap:10px}
.brand{font-family:"Archivo",Arial,sans-serif; font-weight:700; letter-spacing:.06em; text-transform:uppercase; font-size:13px; color:var(--muted)}
h1{font-family:"Archivo",Arial,sans-serif; font-size:28px; margin:4px 0 0}
p{margin:0; color:var(--muted); font-size:17px; line-height:1.5}
</style>
</head>
<body>
  <main class="card">
    <div class="brand">NEZER Repair &amp; Remodeling</div>
    <h1>This link has expired</h1>
    <p>The closet design preview is no longer available. Please contact NEZER Repair &amp; Remodeling for a new link.</p>
  </main>
<script>
// Visit log for the expired link (owner's own browsers are skipped via ?owner=1)
(function(){
  try {
    const p = new URLSearchParams(location.search);
    if (p.get("owner") === "1"){ localStorage.setItem("closetOwner", "1"); history.replaceState(null, "", location.pathname + location.hash); }
    if (p.get("owner") === "0"){ localStorage.removeItem("closetOwner"); history.replaceState(null, "", location.pathname + location.hash); }
    if (localStorage.getItem("closetOwner") === "1") return;
  } catch (e) {}
  let vid = "";
  try { vid = localStorage.getItem("closetVisitor") || ""; if (!vid){ vid = Math.random().toString(36).slice(2, 12); localStorage.setItem("closetVisitor", vid); } } catch (e) {}
  const m = location.hash.match(/^#closet([12])-([abc])$/);
  const row = {
    page: "closets-expired",
    variant: m ? ("expired-closet" + m[1] + "-" + m[2]) : "expired",
    visitor_id: vid || null,
    device: navigator.userAgent.slice(0, 300),
    referrer: (document.referrer || "").slice(0, 300) || null,
    lang: (navigator.language || "").slice(0, 20),
    tz: (Intl.DateTimeFormat().resolvedOptions().timeZone || "").slice(0, 60),
    screen: (screen.width + "x" + screen.height).slice(0, 20)
  };
  fetch("https://lbamryztsbmmprhcfsdg.supabase.co/rest/v1/closet_page_views", {
    method: "POST", keepalive: true,
    headers: { "apikey": "sb_publishable_BxrxaE95_p7IXEEfwZmYhA_G9mDDQ_H", "Content-Type": "application/json", "Prefer": "return=minimal" },
    body: JSON.stringify(row)
  }).catch(() => {});
})();
</script>
</body>
</html>
