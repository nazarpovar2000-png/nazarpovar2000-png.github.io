<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Конструктор кухни</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: спокойный, как образцы в мебельном салоне
   IDEA: стол с образцами — веер красок, планка ручек, пластины плитки
   PICTURE: сама 3D-кухня, всё меняется прямо на ней
   COLOUR and TYPE: эспрессо #23160f, крем #efe6d2, латунь #c9a45c; Commissioner
   LAYOUT: сцена слева, панель образцов справа 380px; на телефоне сцена сверху, панель снизу */
:root{color-scheme:dark;--bg:#1d1410;--panel:#23160f;--line:rgba(239,230,210,.14);--ink:#efe6d2;--mut:#bfae92;--acc:#c9a45c}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 Commissioner,system-ui,sans-serif}
#c{position:fixed;left:0;top:0;width:calc(100% - 380px);height:100%;display:block;touch-action:none}
.side{position:fixed;right:0;top:0;width:380px;height:100%;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
.hd{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
h1{font-size:20px;line-height:1.15;margin:0;font-weight:600}
.sub{margin:4px 0 0;color:var(--mut);font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:12px}
.tabs button{padding:0 6px;min-height:36px}
.secs{display:flex;gap:4px;margin-top:12px;padding:3px;border-radius:12px;background:rgba(127,127,127,.14)}.secs button{flex:1;min-height:40px;font-size:15px;font-weight:600;border-color:transparent;background:transparent}.secs button[aria-pressed=true]{background:var(--acc);color:#241711}
.hbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}.hbar button{min-height:38px}.hbtn{padding:0 12px}.hbtn[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#241711}
.tabs{grid-template-columns:repeat(auto-fit,minmax(78px,1fr))!important}
.rbtn{background:var(--acc);color:#241711;border-color:var(--acc);font-weight:600;padding:0 18px}
.rbtn:hover{background:#d8b56c}
#rov{position:fixed;inset:0;background:rgba(15,10,7,.55);display:grid;place-items:center;z-index:10;padding:16px}
#rov[hidden]{display:none}
.rbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(360px,100%)}
.rbox.wide{width:min(1100px,100%);max-height:100%;overflow:auto}
.rbox img{width:100%;max-height:72vh;object-fit:contain;background:#000;border-radius:8px;display:block}
.rbox p{color:var(--mut);font-size:13.5px;margin:10px 0}
.rbar{height:6px;background:rgba(239,230,210,.12);border-radius:3px;overflow:hidden;margin-bottom:12px}.rbar i{display:block;height:100%;width:0;background:var(--acc)}
.rrow{display:flex;gap:8px;flex-wrap:wrap}
.rlink{display:inline-flex;align-items:center;padding:0 12px;min-height:36px;border:1px solid var(--line);border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
.rgal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rgal button{display:block;padding:0;text-align:left;overflow:hidden;min-height:0}
.rgal img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.rgal span{display:block;padding:6px 8px 0;font-size:12.5px}
.rgal span.rd{padding:2px 8px 8px;color:var(--mut);font-size:11.5px;line-height:1.35}
.body{flex:1;overflow-y:auto;padding:14px 18px 24px}
h2{font-size:14px;font-weight:600;margin:16px 0 8px;color:var(--mut)}
h2:first-child{margin-top:0}
button{font:inherit;font-size:14px;color:var(--ink);background:rgba(239,230,210,.07);border:1px solid var(--line);border-radius:10px;min-height:40px;padding:0 12px;cursor:pointer}
button:hover{background:rgba(239,230,210,.14)}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button[aria-pressed=true]{background:var(--acc);color:#241711;border-color:var(--acc)}
.seg{display:flex;gap:4px}.seg button{flex:1}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.sw button{display:flex;flex-direction:column;align-items:stretch;padding:6px;gap:5px;text-align:left;font-size:12px;line-height:1.2;min-height:0}
.sw i{display:block;height:44px;border-radius:6px;border:1px solid rgba(0,0,0,.25);background-size:cover}
.sw small{color:inherit;opacity:.75}
.list{display:flex;flex-direction:column;gap:6px}
.list button{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center;text-align:left;padding:7px 9px;min-height:56px}
.list button i{width:76px;height:56px;border-radius:6px;background-size:cover;border:1px solid rgba(0,0,0,.3)}
.list b{font-weight:600;font-size:14px;display:block}.list span{font-size:12.5px;opacity:.8}
.dots{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:6px}.dots button{min-height:30px;height:30px;padding:0;border-radius:50%;border:2px solid rgba(0,0,0,.3)}.dots button[aria-pressed=true]{outline:2px solid var(--acc);outline-offset:2px;border-color:#000}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border-radius:999px;display:flex;align-items:center;gap:7px}
.chips i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.4)}
.card{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.18);font-size:13.5px}
.card b{display:block;font-size:15px}.card p{margin:6px 0 0;color:var(--mut)}
.card a{color:var(--acc)}
.est{display:grid;gap:8px}.est .r{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 12px;border:1px solid var(--line,rgba(127,127,127,.25));border-radius:10px}
.est .r b{font-weight:600}.est .r small{color:var(--mut);font-size:12px}.est .sum{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.est label{display:flex;align-items:center;gap:6px;font-size:13px}.est .opts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.est input[type=number]{width:76px;min-height:32px;padding:0 8px;font:inherit;border-radius:8px;border:1px solid var(--line,rgba(127,127,127,.35));background:transparent;color:inherit}
.est .tot{display:flex;justify-content:space-between;align-items:baseline;padding:12px;border-radius:10px;background:rgba(127,127,127,.12);font-size:15px}.est .tot b{font-size:22px}
.note{font-size:12.5px;color:var(--mut);margin-top:14px}
.views{position:fixed;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 404px)}
.views button{background:rgba(35,22,15,.85);backdrop-filter:blur(6px);border-radius:999px;font-size:13px;min-height:36px}
.views button[aria-pressed=true]{background:var(--acc)}
.lightbar{position:fixed;left:12px;bottom:12px;display:flex;align-items:center;gap:6px;z-index:2}
.lightbar span{font-size:12.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);margin-right:2px}
.lightbar button{background:rgba(35,22,15,.85);backdrop-filter:blur(6px);border-radius:999px;font-size:13px;min-height:34px;padding:0 12px}
.lightbar button[aria-pressed=true]{background:var(--acc)}
#load{position:fixed;inset:0;display:grid;place-items:center;color:var(--mut);pointer-events:none}
@media(max-width:760px){.lightbar{bottom:calc(48% + 8px)}.lightbar span{display:none}#c{width:100%;height:52%}.side{top:52%;width:100%;height:48%;border-left:0;border-top:1px solid var(--line)}.views{max-width:calc(100% - 24px);flex-wrap:nowrap;overflow-x:auto}.views button{flex:none}.hd{padding:10px 14px 8px}.sub{display:none}h1{font-size:17px}.tabs{margin-top:8px}.body{padding:12px 14px 20px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/","three/examples/jsm/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/","three-mesh-bvh":"https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.10.0/build/index.module.js","three-gpu-pathtracer":"https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@0.0.28/build/index.module.js"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="load">Загружаю 3D-сцену…</div>
<div class="lightbar" id="lightbar" role="group" aria-label="Свет"><span>Свет:</span><button data-light="bright" aria-pressed="true">Светло</button><button data-light="day" aria-pressed="false">День</button><button data-light="evening" aria-pressed="false">Вечер</button><button data-light="lamps" aria-pressed="false">Лампы</button></div>
<div class="views" id="views">
  <button data-v="overview" aria-pressed="true">Общий вид</button>
  <button data-v="wall" aria-pressed="false">Плита и шкафы</button>
  <button data-v="island" aria-pressed="false">Остров</button>
  <button data-v="seats" aria-pressed="false">Со стороны стульев</button>
  <button data-v="nook" aria-pressed="false">Ниша</button>
  <button data-v="top" aria-pressed="false">Сверху</button>
  <button id="walls" aria-pressed="true">Стены</button>
</div>
<aside class="side">
  <div class="hd">
    <h1>Конструктор кухни</h1>
    <div class="hbar"><button id="estBtn" class="hbtn">Смета</button><button id="galBtn" class="hbtn">Рендеры</button><button id="renderBtn" class="rbtn">Рендер</button></div>
    <p class="sub">Выберите образец, и он сразу появится на модели. <button id="reset" style="min-height:28px;font-size:12.5px;padding:0 9px;margin-left:4px">Вернуть оригинал</button></p>
    <div class="secs" id="secs"><button data-sec="kit">Кухня</button><button data-sec="isl">Остров</button><button data-sec="desk">Ниша</button></div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
  <div class="body" id="body"></div>
</aside>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
{
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1d1410);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 60);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.495; controls.minDistance = 0.8; controls.maxDistance = 14;

// ---------- procedural textures ----------
function rnd(seed){ let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function canvasTex(w, h, draw, srgb = true){
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t;
}
function woodDraw(base, seed){ return (g, w, h) => {
  const r = rnd(seed); g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 260; i++){ const x = r() * w, lw = 0.5 + r() * 3, a = 0.04 + r() * 0.12;
    g.strokeStyle = r() > .5 ? `rgba(15,7,4,${a})` : `rgba(95,55,35,${a*0.6})`; g.lineWidth = lw; g.beginPath();
    let xx = x; g.moveTo(xx, 0); for (let y = 0; y <= h; y += 16){ xx += (r() - .5) * 2.2; g.lineTo(xx, y); } g.stroke(); }
  for (let k = 0; k < 3; k++){ const cx = r() * w, cy = r() * h; for (let j = 6; j > 0; j--){ g.strokeStyle = `rgba(20,9,5,${0.08})`; g.lineWidth = 1.2; g.beginPath(); g.ellipse(cx, cy, j * 2.2, j * 7, 0, 0, Math.PI * 2); g.stroke(); } }
}; }
const woodTexV = canvasTex(512, 512, woodDraw('#26150f', 7));
const woodTexH = woodTexV.clone(); woodTexH.center.set(.5, .5); woodTexH.rotation = Math.PI / 2; woodTexH.needsUpdate = true;
const quartzTex = canvasTex(512, 512, (g, w, h) => { const r = rnd(3); g.fillStyle = '#e8ddc3'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 5000; i++){ const v = r(); g.fillStyle = v > .7 ? 'rgba(255,252,240,.7)' : v > .35 ? 'rgba(200,185,155,.55)' : 'rgba(150,135,110,.35)'; const s = .6 + r() * 1.8; g.fillRect(r() * w, r() * h, s, s); } });
const tileTex = canvasTex(1024, 512, (g, w, h) => { const r = rnd(11); g.fillStyle = '#6b6754'; g.fillRect(0, 0, w, h);
  const rows = 12, rh = h / rows, pal = ['#8f8a70', '#9a9479', '#847f66', '#a19b80', '#8a8469', '#7b765f'];
  for (let i = 0; i < rows; i++){ let x = -r() * 120; while (x < w){ const tw = 70 + r() * 230; const col = pal[Math.floor(r() * pal.length)];
      const gr = g.createLinearGradient(0, i * rh, 0, (i + 1) * rh); gr.addColorStop(0, col); gr.addColorStop(.45, '#b3ad94'); gr.addColorStop(.6, col); gr.addColorStop(1, col);
      g.fillStyle = gr; g.fillRect(x + 1.5, i * rh + 1.5, tw - 3, rh - 3); x += tw; } } });
const floorTex = canvasTex(1024, 1024, (g, w, h) => { const r = rnd(5); const n = 8, pw = w / n;
  for (let i = 0; i < n; i++){ let y = -r() * h; while (y < h){ const L = 300 + r() * 500; const l = 13 + r() * 6;
      g.fillStyle = `hsl(${18 + r() * 8},${24 + r() * 10}%,${l}%)`; g.fillRect(i * pw, y, pw, L);
      for (let k = 0; k < 40; k++){ g.fillStyle = `rgba(${r() > .6 ? '120,85,60' : '10,5,3'},${.05 + r() * .1})`; g.fillRect(i * pw + r() * pw, y + r() * L, 1 + r() * 2, 10 + r() * 80); }
      g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(i * pw, y, pw, 2); y += L; }
    g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(i * pw, 0, 2, h); } });
const blindsTex = canvasTex(64, 256, (g, w, h) => { for (let y = 0; y < h; y += 8){ g.fillStyle = '#f4f1ea'; g.fillRect(0, y, w, 6); g.fillStyle = '#b8b2a6'; g.fillRect(0, y + 6, w, 2); } });

// ---------- materials ----------
const M = {
  woodV: new THREE.MeshStandardMaterial({ name: 'Espresso_wood_V', map: woodTexV, roughness: .55, metalness: 0 }),
  woodH: new THREE.MeshStandardMaterial({ name: 'Espresso_wood_H', map: woodTexH, roughness: .55, metalness: 0 }),
  carcass: new THREE.MeshStandardMaterial({ name: 'Espresso_carcass', color: 0x2c1912, roughness: .7 }),
  kick: new THREE.MeshStandardMaterial({ name: 'Toe_kick', color: 0x1c100b, roughness: .9 }),
  quartz: new THREE.MeshStandardMaterial({ name: 'Cream_quartz', map: quartzTex, roughness: .28 }),
  steel: new THREE.MeshStandardMaterial({ name: 'Stainless', color: 0xc9cbcc, metalness: 1, roughness: .32 }),
  steelDark: new THREE.MeshStandardMaterial({ name: 'Stainless_dark', color: 0x8d9093, metalness: 1, roughness: .4 }),
  pull: new THREE.MeshStandardMaterial({ name: 'Brushed_pull', color: 0xd6d6d2, metalness: 1, roughness: .25 }),
  black: new THREE.MeshStandardMaterial({ name: 'Black_glass', color: 0x0b0b0c, roughness: .12, metalness: .2 }),
  matteBlack: new THREE.MeshStandardMaterial({ name: 'Cast_iron', color: 0x161616, roughness: .75 }),
  tile: new THREE.MeshStandardMaterial({ name: 'Glass_tile', map: tileTex, roughness: .12, metalness: .05 }),
  wall: new THREE.MeshStandardMaterial({ name: 'Wall_beige', color: 0xe6dcc6, roughness: .92 }),
  trim: new THREE.MeshStandardMaterial({ name: 'White_trim', color: 0xf3f0ea, roughness: .55 }),
  panel: new THREE.MeshStandardMaterial({ name: 'Island_back_panel', color: 0xe3dac8, roughness: .7 }),
  floor: new THREE.MeshStandardMaterial({ name: 'Dark_wood_floor', map: floorTex, roughness: .45 }),
  blinds: new THREE.MeshStandardMaterial({ name: 'Window_blinds', map: blindsTex, emissive: 0xffffff, emissiveMap: blindsTex, emissiveIntensity: .35, roughness: .9 }),
  brass: new THREE.MeshStandardMaterial({ name: 'Brass', color: 0xc9a45c, metalness: 1, roughness: .3 }),
  glass: new THREE.MeshStandardMaterial({ name: 'Pendant_glass', color: 0xffffff, transparent: true, opacity: .22, roughness: .05, metalness: 0, side: THREE.DoubleSide }),
};
floorTex.repeat.set(1, 1);

// ---------- zones (cabinet finish per area) ----------
function mkZone(n){ return { V: M.woodV.clone(), H: M.woodH.clone(), carc: M.carcass.clone() }; }
const ZONES = { run: mkZone('run'), up: mkZone('up'), isl: mkZone('isl') }; let Z = ZONES.run;
ZONES.up.V.name = 'Upper_finish_V'; ZONES.up.H.name = 'Upper_finish_H';
ZONES.isl.V.name = 'Island_finish_V'; ZONES.isl.H.name = 'Island_finish_H'; ZONES.run.V.name = 'Lower_finish_V'; ZONES.run.H.name = 'Lower_finish_H';
const PULLS = [];
// ---------- helpers ----------
const root = new THREE.Group(); root.name = 'Kitchen'; scene.add(root);
function B(g, x0, x1, y0, y1, z0, z1, mat, name){
  const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), mat);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); m.castShadow = m.receiveShadow = true; if (name) m.name = name; g.add(m); return m;
}
function cyl(g, r, h, mat, x, y, z, axis = 'y', seg = 16){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), mat); m.position.set(x, y, z);
  if (axis === 'x') m.rotation.z = Math.PI / 2; if (axis === 'z') m.rotation.x = Math.PI / 2; m.castShadow = true; g.add(m); return m;
}
function bar(g, cx, cy, z, len, vertical){
  const p = new THREE.Group(); p.name = 'Bar_pull';
  cyl(p, .0065, len, M.pull, 0, 0, .03, 'y', 12);
  const off = len / 2 - .03; cyl(p, .0045, .03, M.pull, 0, off, .015, 'z', 10); cyl(p, .0045, .03, M.pull, 0, -off, .015, 'z', 10);
  if (!vertical) p.rotation.z = Math.PI / 2; p.position.set(cx, cy, z); g.add(p);
}
// Shaker door/drawer front, facing +z, back face at z0
function front(g, x0, x1, y0, y1, z0, pull){
  const d = new THREE.Group(); d.name = 'Shaker_front'; d.userData.zone = Object.keys(ZONES).find(k => ZONES[k] === Z); const t = .019, fw = Math.min(.068, (y1 - y0) * .26, (x1 - x0) * .2);
  B(d, x0 + fw, x1 - fw, y0 + fw, y1 - fw, z0, z0 + t - .007, Z.V);
  B(d, x0, x0 + fw, y0, y1, z0, z0 + t, Z.V); B(d, x1 - fw, x1, y0, y1, z0, z0 + t, Z.V);
  B(d, x0 + fw, x1 - fw, y0, y0 + fw, z0, z0 + t, Z.H); B(d, x0 + fw, x1 - fw, y1 - fw, y1, z0, z0 + t, Z.H);
  if (pull){ const L = pull.len || (pull.v ? .2 : Math.min(.3, (x1 - x0) * .5));
    const px = pull.x === 'l' ? x0 + .045 : pull.x === 'r' ? x1 - .045 : (x0 + x1) / 2;
    const py = pull.y === 'top' ? y1 - .045 - L / 2 : pull.y === 'bot' ? y0 + .045 + L / 2 : (y0 + y1) / 2;
    const e = { g: d, x0, x1, y0, y1, px, py, z: z0 + t, L, v: !!pull.v, yt: pull.y, xt: pull.x, c: new THREE.Group() };
    e.zone = d.userData.zone; e.c.name = 'Hardware'; d.add(e.c); PULLS.push(e); }
  g.add(d); return d;
}
const G = .0015; // reveal gap
const D = .58, TOP0 = .876, TOP1 = .906, KICK = .10;
function carcass(g, x0, x1, top = TOP0){ B(g, x0, x1, KICK, top, 0, D, Z.carc); B(g, x0, x1, 0, KICK, 0, D - .07, M.kick); }
function baseCab(g, x0, x1, kind){
  const c = new THREE.Group(); c.name = 'Base_' + kind; carcass(c, x0, x1, kind === 'doors' ? .62 : TOP0); const xm = (x0 + x1) / 2;
  if (kind === 'drawer+doors'){
